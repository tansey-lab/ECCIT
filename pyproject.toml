[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eccit"
version = "0.1.0"
description = "ECCIT: calibration workflows for conditional independence tests"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "torch",
  "tqdm",
  "matplotlib",
  "scikit-learn",
  "statsmodels",
  "xgboost",
  "joblib",
  "dill",
]

[project.scripts]
eccit = "eccit.cli.main:main"
eccit-cluster = "eccit.cli.cluster:main"
eccit-collect-results = "eccit.cli.collect_results:main"
eccit-plot-results = "eccit.cli.plot_results:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["eccit*"]
